<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Translator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --success: #10b981;
      --danger: #ef4444;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      padding: 2px 6px;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    button {
      flex: 1;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary {
      background: var(--primary);
      color: #0f172a;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      color: #fff;
    }
    .btn-secondary {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: #283548;
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 7px 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      outline: none;
    }
    input:focus {
      border-color: var(--primary);
    }
    .settings-toggle {
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
      margin-bottom: 8px;
      display: inline-block;
    }
    .settings-panel {
      display: none;
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .settings-panel.open {
      display: block;
    }
    .status-box {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 32px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
    }
    .status-dot.active {
      background: var(--success);
    }
    .status-dot.error {
      background: var(--danger);
    }
    .lang-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      margin-bottom: 12px;
    }
    .lang-col {
      flex: 1;
    }
    select {
      width: 100%;
      padding: 6px 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 11px;
      outline: none;
      cursor: pointer;
    }
    select:focus {
      border-color: var(--primary);
    }
    .btn-swap {
      flex: 0 0 28px;
      height: 28px;
      padding: 0;
      font-size: 13px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-swap:hover {
      color: var(--text);
      border-color: var(--primary);
    }
  </style>
</head>
<body>
  <header>
    <h1>AI Translator <span id="langPairBadge" class="badge">AUTO → RU</span></h1>
  </header>

  <div class="lang-row">
    <div class="lang-col">
      <label for="sourceLang">С какого:</label>
      <select id="sourceLang">
        <option value="auto" selected>Автоопределение</option>
        <option value="zh">Китайский (ZH)</option>
        <option value="en">Английский (EN)</option>
        <option value="ja">Японский (JA)</option>
        <option value="ko">Корейский (KO)</option>
        <option value="de">Немецкий (DE)</option>
        <option value="fr">Французский (FR)</option>
        <option value="es">Испанский (ES)</option>
        <option value="it">Итальянский (IT)</option>
        <option value="ru">Русский (RU)</option>
      </select>
    </div>
    <button id="swapLangsBtn" type="button" title="Поменять местами" class="btn-swap">⇄</button>
    <div class="lang-col">
      <label for="targetLang">На какой:</label>
      <select id="targetLang">
        <option value="ru" selected>Русский (RU)</option>
        <option value="en">Английский (EN)</option>
        <option value="zh">Китайский (ZH)</option>
        <option value="de">Немецкий (DE)</option>
        <option value="fr">Французский (FR)</option>
        <option value="es">Испанский (ES)</option>
        <option value="ja">Японский (JA)</option>
        <option value="ko">Корейский (KO)</option>
        <option value="it">Итальянский (IT)</option>
      </select>
    </div>
  </div>

  <div class="btn-group">
    <button id="translateBtn" class="btn-primary">Перевести</button>
    <button id="restoreBtn" class="btn-secondary">Оригинал</button>
  </div>

  <span id="toggleSettings" class="settings-toggle">⚙️ Настройки API</span>

  <div id="settingsPanel" class="settings-panel">
    <div class="field" style="margin-bottom: 10px;">
      <label for="providerSelect">Заполнить из шаблона (быстрый пресет):</label>
      <select id="providerSelect">
        <option value="" disabled selected>-- Выберите шаблон провайдера --</option>
        <option value="gemini">🌐 Google Gemini (gemini-3.5-flash-lite)</option>
        <option value="deepseek">🐋 DeepSeek API (deepseek-chat / V3)</option>
        <option value="openai">🤖 OpenAI (ChatGPT / gpt-4o-mini)</option>
        <option value="groq">⚡ Groq (Llama 3.3 70B - ультраскорость)</option>
        <option value="openrouter">🔀 OpenRouter (Все модели мира)</option>
        <option value="anthropic">🧠 Anthropic Claude (claude-3-5-haiku)</option>
        <option value="mistral">🇪🇺 Mistral AI (mistral-small)</option>
        <option value="ollama">🦙 Ollama (Локально: 11434)</option>
        <option value="lmstudio">💻 LM Studio (Локально: 1234)</option>
        <option value="local8045">⚡ Локальный прокси (8045)</option>
      </select>
    </div>

    <div class="field">
      <label for="apiUrl">API URL:</label>
      <input type="text" id="apiUrl" placeholder="http://localhost:8045/v1/chat/completions">
    </div>

    <div class="field">
      <label for="apiKey">API Key (Ключ авторизации):</label>
      <input type="password" id="apiKey" placeholder="sk-... или AIzaSy...">
    </div>

    <div class="field">
      <label for="model">Модель ИИ:</label>
      <input type="text" id="model" placeholder="Название модели (например, deepseek-chat)">
    </div>

    <div class="field">
      <label for="batchSize">Размер пачки (узлов):</label>
      <input type="number" id="batchSize" min="5" max="50" value="20">
    </div>

    <!-- Profile Management Section (внизу под размером пачки) -->
    <div style="background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-top: 10px; margin-bottom: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <label for="profileSelect" style="font-weight: 600; font-size: 11px; color: var(--primary); margin-bottom: 0;">Профиль настроек:</label>
        <div style="display: flex; gap: 4px;">
          <button id="addProfileBtn" type="button" class="btn-secondary" style="font-size: 10px; padding: 3px 6px;" title="Создать новый профиль">+ Новый</button>
          <button id="deleteProfileBtn" type="button" class="btn-secondary" style="font-size: 10px; padding: 3px 6px; color: var(--danger);" title="Удалить текущий профиль">🗑️</button>
        </div>
      </div>

      <select id="profileSelect" style="width: 100%; margin-bottom: 8px; font-weight: 500;">
        <!-- Populated dynamically -->
      </select>

      <div class="field" style="margin-bottom: 8px;">
        <label for="profileName">Название профиля:</label>
        <input type="text" id="profileName" placeholder="Например: Google Gemini (Основной)">
      </div>

      <div style="display: flex; gap: 6px; margin-bottom: 8px;">
        <button id="exportProfilesBtn" type="button" class="btn-secondary" style="font-size: 10px; padding: 4px 6px; flex: 1;" title="Экспортировать профили в JSON-файл">📤 Экспорт JSON</button>
        <button id="importProfilesBtn" type="button" class="btn-secondary" style="font-size: 10px; padding: 4px 6px; flex: 1;" title="Импортировать профили из JSON-файла">📥 Импорт JSON</button>
        <input type="file" id="importProfilesFile" accept=".json,application/json" style="display: none;">
      </div>

      <div style="display: flex; align-items: center; gap: 6px; padding-top: 2px;">
        <input type="checkbox" id="autoRotateCheckbox" style="cursor: pointer; width: 14px; height: 14px; accent-color: var(--primary);">
        <label for="autoRotateCheckbox" style="font-size: 11px; cursor: pointer; user-select: none; color: var(--text); margin-bottom: 0;">
          Авторотация при исчерпании лимита (429/Quota)
        </label>
      </div>
    </div>

    <div class="field" style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
      <span id="cacheStats" style="font-size: 11px; color: var(--text-muted);">Кэш: 0 записей</span>
      <button id="clearCacheBtn" class="btn-secondary" style="flex: 0 0 auto; font-size: 10px; padding: 4px 8px;">Очистить кэш</button>
    </div>

    <div class="btn-group" style="margin-bottom: 0;">
      <button id="testApiBtn" class="btn-secondary" style="font-size: 11px; padding: 6px;">Проверить API</button>
      <button id="saveSettingsBtn" class="btn-primary" style="font-size: 11px; padding: 6px;">Сохранить профиль</button>
    </div>
  </div>

  <div class="status-box">
    <span id="statusDot" class="status-dot"></span>
    <span id="statusText">Готов к переводу</span>
  </div>

  <div style="display: flex; justify-content: space-between; margin-top: 10px; font-size: 11px;">
    <a href="http://127.0.0.1:8046/logs" target="_blank" style="color: var(--primary); text-decoration: none;">📄 Открыть файл логов</a>
    <span id="downloadLogsBtn" style="color: var(--text-muted); cursor: pointer; text-decoration: underline;">Экспорт</span>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
